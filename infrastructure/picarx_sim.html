<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiCar-X — simulateur de trajectoire</title>
<style>
  :root{
    --bg:#0e1218; --panel:#161c26; --line:#243042; --ink:#e8eef6;
    --muted:#8595ab; --accent:#3fd0c9; --accent2:#ff7b3d; --car:#ff3b5c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;}
  .wrap{max-width:1100px;margin:0 auto;padding:22px;display:grid;
    grid-template-columns:1fr 280px;gap:18px;}
  header{grid-column:1/-1;display:flex;align-items:baseline;gap:14px;
    border-bottom:1px solid var(--line);padding-bottom:12px;}
  header h1{font-size:16px;margin:0;letter-spacing:.04em;font-weight:600}
  header span{color:var(--muted);font-size:12px}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px;display:flex;justify-content:center;align-items:center;}
  canvas{max-width:100%;height:auto;border-radius:6px;background:#fff}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;display:flex;flex-direction:column;gap:18px;align-self:start}
  .btns{display:flex;gap:8px}
  button{flex:1;background:#1d2735;color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:10px;font:inherit;font-size:13px;cursor:pointer;
    transition:.15s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);color:#06231f;border-color:var(--accent);font-weight:600}
  button.primary:hover{filter:brightness(1.08);color:#06231f}
  .ctl label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.08em;margin-bottom:8px;display:flex;justify-content:space-between}
  .ctl label b{color:var(--accent);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .stats{border-top:1px solid var(--line);padding-top:14px;display:grid;
    grid-template-columns:1fr 1fr;gap:12px}
  .stat .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .stat .v{font-size:20px;font-variant-numeric:tabular-nums;margin-top:2px}
  .vm-active-box{border-top:1px solid var(--line);padding-top:14px}
  .vm-active-box .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
  .vm-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;
    border-radius:8px;border:2px solid var(--accent);background:rgba(63,208,201,.08);
    font-size:15px;font-weight:700;color:var(--accent);letter-spacing:.04em}
  .vm-badge.migrate{border-color:#f59e0b;background:rgba(245,158,11,.08);color:#f59e0b}
  .vm-badge .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);
    animation:pulse 1.2s ease-in-out infinite}
  .vm-badge.migrate .dot{background:#f59e0b}
  .vm-decision{font-size:10px;color:var(--muted);margin-top:4px}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)}}
  .row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .row input{accent-color:var(--accent)}
  @media(max-width:760px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>PiCar-X · simulateur</h1>
    <span>la voiture part du carré rouge et boucle le circuit en continu</span>
  </header>

  <div class="stage"><canvas id="cv"></canvas></div>

  <div class="panel">
    <div class="btns">
      <button id="play" class="primary">Démarrer</button>
      <button id="dir">Sens ⟳</button>
      <button id="reset">Reset</button>
    </div>
    <div class="btns">
      <button id="csv">Télécharger CSV</button>
    </div>
    <div class="ctl">
      <label>Vitesse u <b><span id="uval">5.0</span> cm/s</b></label>
      <input id="u" type="range" min="0.5" max="60" value="5" step="0.1">
    </div>
    <div class="ctl">
      <label>Rotation <b><span id="rval">0</span>°</b></label>
      <input id="rot" type="range" min="-180" max="180" value="0" step="5">
    </div>
    <div class="ctl">
      <label>Taille voiture <b><span id="cval">2.0</span>×</b></label>
      <input id="car" type="range" min="0.5" max="6" value="2" step="0.1">
    </div>
    <div class="row">
      <input type="checkbox" id="trail" checked>
      <label for="trail" style="margin:0;text-transform:none;letter-spacing:0">Afficher la trace</label>
    </div>
    <div class="vm-active-box">
      <div class="k">Service actif sur</div>
      <div class="vm-badge" id="vm-badge"><span class="dot"></span><span id="vm-name">—</span></div>
      <div class="vm-decision" id="vm-decision">En attente du hub…</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">Tours</div><div class="v" id="laps">0</div></div>
      <div class="stat"><div class="k">Progression</div><div class="v" id="prog">0%</div></div>
      <div class="stat"><div class="k">Distance</div><div class="v" id="dist">0 cm</div></div>
      <div class="stat"><div class="k">Cap</div><div class="v" id="head">0°</div></div>
    </div>
  </div>
</div>

  ctx.font='bold 15px monospace'; ctx.textBaseline='middle';
  for(const v of VMS){
    const [px,py]=cmToPx(v.x,v.y), c=VM_COL[v.type], s=9;
    const isActive = (activeVmId && v.name.replace(' ','') === activeVmId) ||
                     (activeVmId && VM_BY_ID[activeVmId] === v);

    // Halo vert si VM active
    if(isActive){
      ctx.save();
      ctx.shadowColor='#3fd0c9'; ctx.shadowBlur=22;
      ctx.beginPath(); ctx.arc(px,py,s*2.2,0,Math.PI*2);
      ctx.strokeStyle='#3fd0c9'; ctx.lineWidth=3; ctx.stroke();
      ctx.restore();
    }

    ctx.beginPath();
    if(v.type==='edge'){
      ctx.rect(px-s,py-s,2*s,2*s);
    }else{
      ctx.moveTo(px,py-s*1.3); ctx.lineTo(px+s*1.3,py);
      ctx.lineTo(px,py+s*1.3); ctx.lineTo(px-s*1.3,py); ctx.closePath();
    }
    ctx.fillStyle = isActive ? '#3fd0c9' : c;
    ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle = isActive ? '#3fd0c9' : c;
    let lbl = v.name+' ('+v.x+','+v.y+')';
    if(isActive) lbl = '★ '+lbl+' [ACTIF]';
    const lat=vmLat[v.name];
    if(lat!==undefined) lbl += (lat===null ? '  ·  --' : '  ·  '+Math.round(lat)+' ms');
    ctx.fillText(lbl, px+s+5, py);
  }
  ctx.restore();
}

async function pollVmStatus(){
  try{
    const r = await fetch(VM_STATUS_URL);
    const d = await r.json();
    activeVmId = d.service_vm || null;
    const badge = document.getElementById('vm-badge');
    const nameEl = document.getElementById('vm-name');
    const decEl  = document.getElementById('vm-decision');
    if(activeVmId){
      const vm = VM_BY_ID[activeVmId];
      nameEl.textContent = vm ? vm.name.toUpperCase() : activeVmId;
      const lastDec = d.last_decision || '—';
      decEl.textContent = 'Dernière décision : '+lastDec+(d.cycle?' · cycle #'+d.cycle:'');
      badge.className = 'vm-badge'+(lastDec==='migrate'?' migrate':'');
    } else {
      nameEl.textContent = '—';
      decEl.textContent = d.error ? 'Hub injoignable' : 'En attente…';
      badge.className = 'vm-badge';
    }
  }catch(e){
    document.getElementById('vm-name').textContent='—';
    document.getElementById('vm-decision').textContent='Hub injoignable';
  }
  draw();
}
let ROT = 0;
let CAR = 2;
let DIR = -1;
const P = DATA.path, N = P.length;
let segLen=[], total=0;
for(let i=0;i<N;i++){const a=P[i],b=P[(i+1)%N];const d=Math.hypot(b[0]-a[0],b[1]-a[1]);segLen.push(d);total+=d;}
const cum=[0];for(let i=0;i<N;i++)cum.push(cum[i]+segLen[i]);

const img=new Image();
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let scale=1;
function fit(){
  const maxW=Math.min(640, document.querySelector('.stage').clientWidth-20);
  scale=maxW/DATA.w;
  cv.width=DATA.w*scale; cv.height=DATA.h*scale;
}
img.onload=()=>{fit();draw();};
img.src="Trajectoire.jpg";

function posAt(d){
  d=((d%total)+total)%total;
  let lo=0,hi=N;
  while(lo<hi){const m=(lo+hi)>>1; if(cum[m+1]<d)lo=m+1;else hi=m;}
  const i=lo, f=(d-cum[i])/(segLen[i]||1);
  const a=P[i], b=P[(i+1)%N];
  const x=a[0]+(b[0]-a[0])*f, y=a[1]+(b[1]-a[1])*f;
  const ang=Math.atan2(b[1]-a[1], b[0]-a[0]);
  return {x,y,ang};
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.translate(cv.width/2, cv.height/2);
  ctx.rotate(ROT*Math.PI/180);
  ctx.translate(-cv.width/2, -cv.height/2);
  ctx.drawImage(img,0,0,cv.width,cv.height);
  ctx.scale(scale,scale);
  ctx.save();
  ctx.beginPath(); ctx.arc(DATA.origin[0],DATA.origin[1],7,0,7);
  ctx.strokeStyle='#1c8c4a'; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle='#1c8c4a'; ctx.font='bold 16px monospace'; ctx.fillText('(0,0)',DATA.origin[0]+11,DATA.origin[1]+5);
  ctx.restore();
  drawVMs();
  if(document.getElementById('trail').checked && Math.abs(dist)>0){
    ctx.lineWidth=5; ctx.strokeStyle='rgba(255,59,92,.85)';
    ctx.lineCap='round'; ctx.beginPath();
    const step=8, lim=Math.min(Math.abs(dist),total); let started=false;
    for(let s=0; s<=lim; s+=step){
      const p=posAt(DIR*s); if(!started){ctx.moveTo(p.x,p.y);started=true;}else ctx.lineTo(p.x,p.y);
    }
    ctx.stroke();
  }
  const p=posAt(dist);
  ctx.save();
  ctx.translate(p.x,p.y); ctx.rotate(p.ang); ctx.scale(CAR,CAR);
  ctx.fillStyle='#ff3b5c';
  ctx.beginPath();
  ctx.moveTo(13,0); ctx.lineTo(-8,-8); ctx.lineTo(-3,0); ctx.lineTo(-8,8);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.restore();
  const ad=Math.abs(dist);
  document.getElementById('laps').textContent=Math.floor(ad/total);
  document.getElementById('prog').textContent=Math.round(((ad%total)/total)*100)+'%';
  document.getElementById('dist').textContent=(ad/PX_PER_CM).toFixed(0)+' cm';
  let deg=(-p.ang*180/Math.PI); deg=((deg%360)+360)%360;
  document.getElementById('head').textContent=deg.toFixed(0)+'°';
}

let dist=0, playing=false, lastT=0;
let rec=[];

function loop(t){
  if(!playing)return;
  if(!lastT)lastT=t;
  const dt=(t-lastT)/1000; lastT=t;
  const u_px=(+document.getElementById('u').value)*PX_PER_CM;
  dist+=u_px*dt*DIR;
  const q=posAt(dist);
  const xc=(q.x-DATA.origin[0])/PX_PER_CM, yc=(DATA.origin[1]-q.y)/PX_PER_CM;
  if(!rec.length || Math.hypot(xc-rec[rec.length-1][0], yc-rec[rec.length-1][1])>0.1)
    rec.push([+xc.toFixed(2), +yc.toFixed(2)]);
  draw();
  requestAnimationFrame(loop);
}

document.getElementById('play').onclick=()=>{
  playing=!playing;
  document.getElementById('play').textContent=playing?'Pause':'Démarrer';
  document.getElementById('play').classList.toggle('primary',!playing);
  if(playing){lastT=0;requestAnimationFrame(loop);}
};
document.getElementById('reset').onclick=()=>{dist=0;playing=false;lastT=0;rec=[];
  document.getElementById('play').textContent='Démarrer';
  document.getElementById('play').classList.add('primary');draw();};
document.getElementById('dir').onclick=()=>{DIR*=-1; draw();};
document.getElementById('csv').onclick=()=>{
  if(!rec.length){alert('Lance d\'abord la voiture pour enregistrer des points.');return;}
  let txt='x,y\n'+rec.map(p=>p[0]+','+p[1]).join('\n')+'\n';
  const blob=new Blob([txt],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='trajectory_sim.csv'; a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById('u').oninput=()=>{document.getElementById('uval').textContent=(+document.getElementById('u').value).toFixed(1); if(!playing)draw();};
document.getElementById('rot').oninput=()=>{ROT=+document.getElementById('rot').value; document.getElementById('rval').textContent=ROT; draw();};
document.getElementById('car').oninput=()=>{CAR=+document.getElementById('car').value; document.getElementById('cval').textContent=CAR.toFixed(1); draw();};
document.getElementById('trail').onchange=draw;

function carCm(){
  const p=posAt(dist);
  return [(p.x-DATA.origin[0])/PX_PER_CM, (DATA.origin[1]-p.y)/PX_PER_CM];
}
async function tickBridge(){
  const [x,y]=carCm();
  try{
    const r=await fetch(BRIDGE_URL,{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({x:+x.toFixed(2), y:+y.toFixed(2)})});
    const data=await r.json();
    for(const res of data.results) vmLat[res.vm]=res.ok?res.latency_ms:null;
  }catch(e){
    for(const v of VMS) vmLat[v.name]=null;
  }
  draw();
}
setInterval(tickBridge, PING_PERIOD);
setTimeout(tickBridge, 600);

// Polling VM active (hub /status via bridge)
setInterval(pollVmStatus, STATUS_PERIOD);
setTimeout(pollVmStatus, 1000);

window.addEventListener('resize',()=>{fit();draw();});
</script>
